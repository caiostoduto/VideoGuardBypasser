name: Verify plugin builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          path: plugin

      - name: Checkout Vencord (latest release tag)
        uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord
          ref: "main"
          path: vencord

      - name: Add plugin to userplugins
        run: |
          mkdir -p "vencord/src/userplugins/videoGuardBypasser"
          rsync -a "plugin/plugin/" "vencord/src/userplugins/videoGuardBypasser"

      # pnpm version is read from the "packageManager" field in Vencord's package.json
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          working-directory: vencord
          require-lockfile: true
          cache: true

      - name: Type check
        working-directory: vencord
        run: pnpm testTsc

      - name: Build
        working-directory: vencord
        run: pnpm build
